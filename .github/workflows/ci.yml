name: ci

on:
  push:
    paths:
      - "deploy/**"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint deploy scripts
        run: shellcheck -x deploy/*.sh

  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # systemd-analyze verify checks ExecStart paths too, and these units point at
      # the host's checkout. Stub the binary so the check measures the unit syntax
      # instead of the runner's filesystem.
      - name: Stub ExecStart binaries
        run: |
          for u in deploy/systemd/*.service; do
            cmd=$(grep -m1 '^ExecStart=' "$u" | cut -d= -f2- | awk '{print $1}')
            [ -n "$cmd" ] || continue
            sudo mkdir -p "$(dirname "$cmd")"
            sudo touch "$cmd"
            sudo chmod +x "$cmd"
          done
      - name: Verify units
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer

  sudoers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the sudoers drop-in
        run: visudo -cf deploy/sudoers-radio-appliance
