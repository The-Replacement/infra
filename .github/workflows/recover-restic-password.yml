name: Recover restic password

# Two gates on purpose:
# 1. The string RECOVER, so a stray click does nothing.
# 2. The GitHub environment 'recovery', whose required reviewer has to approve the
#    deployment before any job touching its secret can start.
#
# The artifact is NOT plaintext. It is the repo password re-encrypted to the
# caller's own RSA public key, so collaborators on this repository cannot read it
# even while the run and its artifacts are visible.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RECOVER to continue."
        required: true
      recipient_pem:
        description: "RSA public key in PEM. Only its owner can decrypt the artifact."
        required: true

jobs:
  recover:
    if: inputs.confirm == 'RECOVER'
    runs-on: ubuntu-latest
    environment: recovery
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt, then re-encrypt to the named recipient only
        env:
          RECOVERY_KEY: ${{ secrets.RADIO_STATE_RECOVERY_KEY }}
          RECIPIENT_PEM: ${{ inputs.recipient_pem }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RECOVERY_KEY" > /tmp/recovery.pem
          printf '%s\n' "$RECIPIENT_PEM" > /tmp/recipient.pem
          openssl rsa -pubin -in /tmp/recipient.pem -noout -check
          # Plaintext never touches a disk: it lives only inside this pipe.
          openssl pkeyutl -decrypt \
            -inkey /tmp/recovery.pem \
            -in deploy/recovery/restic-password.enc \
          | openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/recipient.pem \
            -out restic-password.enc
          rm -f /tmp/recovery.pem
          echo "Artifact size: $(wc -c < restic-password.enc) bytes"
          echo "Ciphertext sha256: $(sha256sum restic-password.enc | awk '{print $1}')"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: restic-password-encrypted
          path: restic-password.enc
          retention-days: 1
