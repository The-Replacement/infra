name: Recover restic password

# Deliberately manual: decryption should be an intentional act, never a side effect.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RECOVER to decrypt. Any other value skips the run."
        required: true

jobs:
  recover:
    if: inputs.confirm == 'RECOVER'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt into a masked file
        env:
          RECOVERY_KEY: ${{ secrets.RADIO_STATE_RECOVERY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RECOVERY_KEY" > /tmp/recovery.pem
          openssl pkeyutl -decrypt \
            -inkey /tmp/recovery.pem \
            -in deploy/recovery/restic-password.enc \
            -out restic-password.txt
          # Anything that later echoes the value is redacted by the runner.
          echo "::add-mask::$(cat restic-password.txt)"
          echo "Decrypted length: $(wc -c < restic-password.txt) bytes"
          echo "Fingerprint sha256: $(sha256sum restic-password.txt | awk '{print $1}')"
          rm -f /tmp/recovery.pem

      - name: Publish only as a one-day artifact, never in the log
        uses: actions/upload-artifact@v4
        with:
          name: restic-password-recovery
          path: restic-password.txt
          retention-days: 1
